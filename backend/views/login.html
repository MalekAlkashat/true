<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TRUE Admin Login</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #101114;
        color: #f4f4f5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(380px, calc(100vw - 32px));
        background: #181a20;
        border: 1px solid #2b2f3a;
        border-radius: 8px;
        padding: 28px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 24px;
        letter-spacing: 0;
      }

      label {
        display: block;
        margin-bottom: 14px;
        color: #c9ccd4;
        font-size: 14px;
      }

      input {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #343946;
        border-radius: 6px;
        background: #0f1117;
        color: #ffffff;
        font: inherit;
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
        border: 0;
        border-radius: 6px;
        background: #2f7df6;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      .error {
        margin: 0 0 14px;
        color: #ff8f8f;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TRUE Admin</h1>
      {{ERROR}}
      <form method="post" action="/admin/login">
        <label>
          Username
          <input name="username" autocomplete="username" required>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
